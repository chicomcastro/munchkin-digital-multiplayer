name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  server-tests:
    name: Server — unit + integration + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 14

  client-tests:
    name: Client — unit + integration + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage
          retention-days: 14

  e2e:
    name: Cypress E2E + visual catalog
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build server
        working-directory: server
        run: |
          npm ci
          npm run build
          echo "--- server/dist contents ---"
          ls -la dist

      - name: Install + build client
        working-directory: client
        env:
          VITE_SERVER_URL: 'http://localhost:3001'
        run: |
          npm ci
          npm run build
          echo "--- client/dist contents ---"
          ls -la dist

      - name: Install Cypress + deps
        working-directory: e2e
        run: |
          npm ci
          npx cypress install
          npx cypress info

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Run E2E with full diagnostics
        env:
          PORT: '3001'
          CLIENT_URL: 'http://localhost:5173'
          CYPRESS_BASE_URL: 'http://localhost:5173'
          CYPRESS_SERVER_URL: 'http://localhost:3001'
        run: |
          set +e
          mkdir -p logs
          # Tee all output of this step to a file we can post back to the PR.
          exec > >(tee logs/e2e-debug.log) 2>&1

          echo "================ Starting server ================"
          ( cd server && PORT=3001 CLIENT_URL='http://localhost:5173' \
            nohup node dist/index.js > "$GITHUB_WORKSPACE/logs/server.log" 2>&1 < /dev/null & )
          SERVER_BG=$!
          echo "Server background subshell pid: $SERVER_BG"
          sleep 1

          echo "--- Waiting up to 60s for server /health ---"
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "Server ready after ${i} polls"
              curl -s http://localhost:3001/health
              echo
              break
            fi
            if [ "$i" = "120" ]; then
              echo "!!! Server failed to start !!!"
              echo "--- server.log ---"
              cat logs/server.log 2>/dev/null || echo "(no log)"
              exit 1
            fi
            sleep 0.5
          done

          echo "================ Starting client preview ================"
          ( cd client && \
            nohup ./node_modules/.bin/vite preview --host 0.0.0.0 --port 5173 > "$GITHUB_WORKSPACE/logs/client.log" 2>&1 < /dev/null & )
          CLIENT_BG=$!
          echo "Client background subshell pid: $CLIENT_BG"
          sleep 1

          echo "--- Waiting up to 60s for client 5173 ---"
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "Client ready after ${i} polls"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "!!! Client failed to start !!!"
              echo "--- client.log ---"
              cat logs/client.log 2>/dev/null || echo "(no log)"
              exit 1
            fi
            sleep 0.5
          done

          echo "================ Pre-test sanity checks ================"
          echo "--- ports ---"
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E "5173|3001" || true
          echo "--- node procs ---"
          pgrep -af node || true

          echo "================ Running Cypress ================"
          ( cd e2e && npx cypress run --reporter spec )
          CYPRESS_EXIT=$?
          echo "Cypress exit code: $CYPRESS_EXIT"

          echo "================ Final server log tail ================"
          tail -n 40 logs/server.log || true
          echo "================ Final client log tail ================"
          tail -n 40 logs/client.log || true

          exit $CYPRESS_EXIT

      - name: Build visual catalog HTML
        if: always()
        run: node scripts/build-visual-catalog.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-catalog
          path: e2e/cypress/screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload visual catalog HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-catalog-html
          path: e2e/visual-catalog.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: logs
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots to ci-evidence branch
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          if [ ! -d e2e/cypress/screenshots ] || [ -z "$(ls -A e2e/cypress/screenshots 2>/dev/null)" ]; then
            echo "No screenshots to publish; skipping."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"
          BRANCH="ci-evidence"
          REPO="${{ github.repository }}"
          WORK=$(mktemp -d)

          echo "Cloning $BRANCH (creating if it doesn't exist)..."
          if ! git clone --depth=1 --branch "$BRANCH" --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$WORK" 2>/dev/null; then
            git clone --depth=1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$WORK"
            (
              cd "$WORK"
              git checkout --orphan "$BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
              printf '# CI evidence\n\nScreenshots from Cypress E2E runs. Published per PR by `.github/workflows/ci.yml`.\n' > README.md
              git config user.email 'actions@github.com'
              git config user.name 'github-actions[bot]'
              git add README.md
              git commit -m "Initialize $BRANCH"
              git push origin "$BRANCH"
            )
          fi

          DEST="$WORK/pr-$PR_NUMBER/$SHORT_SHA"
          rm -rf "$WORK/pr-$PR_NUMBER"
          mkdir -p "$DEST"
          cp -r e2e/cypress/screenshots/. "$DEST/"

          cd "$WORK"
          git config user.email 'actions@github.com'
          git config user.name 'github-actions[bot]'
          git add -A
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "PR #$PR_NUMBER: screenshots for $SHORT_SHA [skip ci]"
            git push origin "$BRANCH"
          fi
          # For private repos: github.com/.../blob/{ref}/{path}?raw=true serves the raw image
          # to authenticated viewers via their session cookies (raw.githubusercontent.com
          # would 404 anonymously). Embedded <img> tags resolve the same way client-side.
          echo "RAW_BASE_URL=https://github.com/${REPO}/blob/${BRANCH}/pr-${PR_NUMBER}/${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "RAW_URL_SUFFIX=?raw=true" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build visual evidence PR comment
        if: always() && github.event_name == 'pull_request' && env.RAW_BASE_URL != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/build-evidence-comment.mjs

      - name: Post visual evidence as sticky PR comment
        if: always() && github.event_name == 'pull_request' && env.RAW_BASE_URL != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: visual-evidence
          path: evidence-comment.md

      - name: Build E2E debug PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p logs
          {
            echo '## 🔧 E2E debug (auto-posted by CI)'
            echo
            echo 'Last failure log (truncated to last 200 lines):'
            echo
            echo '```'
            tail -n 200 logs/e2e-debug.log 2>/dev/null || echo '(no e2e-debug.log captured)'
            echo '```'
            echo
            echo '<details><summary>server.log</summary>'
            echo
            echo '```'
            tail -n 60 logs/server.log 2>/dev/null || echo '(no server.log)'
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>client.log</summary>'
            echo
            echo '```'
            tail -n 60 logs/client.log 2>/dev/null || echo '(no client.log)'
            echo '```'
            echo
            echo '</details>'
          } > e2e-debug-comment.md

      - name: Post E2E debug as sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-debug
          path: e2e-debug-comment.md

  coverage-comment:
    name: Comment coverage on PR
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download server coverage
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: server-coverage
      - name: Download client coverage
        uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: client-coverage
      - name: Build coverage comment
        id: build
        run: node scripts/build-coverage-comment.mjs
      - name: Post or update comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-summary
          path: coverage-comment.md
